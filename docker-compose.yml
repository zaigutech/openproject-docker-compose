# 这里只放开发和生产共用的配置。开发见 docker-compose.override.yml，生产见 docker-compose.prod.yml。
# 需要先启动 ../middleware，它提供 zaigu_network、db 和数据库密码。
#
# Compose 把服务名注册成共享网络上的别名，所以服务名带 openproject- 前缀：web 会和 Plane 的 web 冲突。
# hocuspocus 不加前缀：上游经常升级紧挨着服务名的 image 行，改名每次合并都会冲突，这个名字目前也没有冲突。
networks:
  default:
    external: true
    name: zaigu_network

secrets:
  openproject_password:
    file: ../middleware/secrets/openproject_password

volumes:
  opdata:

x-op-restart-policy: &restart_policy
  restart: unless-stopped
x-op-image: &image
  image: openproject/openproject:${TAG:-18-rc-slim}
x-op-app: &app
  <<: [*image, *restart_policy]
  secrets:
    - openproject_password
  # 从 secret 拼出 DATABASE_URL，再交给镜像原来的 entrypoint
  entrypoint:
    - /bin/bash
    - -c
    - |
      export DATABASE_URL="postgres://openproject:$$(cat /run/secrets/openproject_password)@db/openproject_db?pool=20&encoding=unicode&reconnect=true"
      exec ./docker/prod/entrypoint-slim.sh "$$@"
    - "--"
  environment:
    OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-true}"
    OPENPROJECT_HOST__NAME: "${OPENPROJECT_HOST__NAME:-localhost:8080}"
    OPENPROJECT_ADDITIONAL__HOST__NAMES: "${OPENPROJECT_ADDITIONAL__HOST__NAMES:-openproject-web}" # to allow access from hocuspocus directly
    OPENPROJECT_HSTS: "${OPENPROJECT_HSTS:-true}"
    OPENPROJECT_RAILS__CACHE__STORE: "memcache"
    OPENPROJECT_CACHE__MEMCACHE__SERVER: "openproject-cache:11211"
    OPENPROJECT_RAILS__RELATIVE__URL__ROOT: "${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}"
    OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__URL: "${COLLABORATIVE_SERVER_URL:-wss://${OPENPROJECT_HOST__NAME:-localhost:8080}/hocuspocus}"
    OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__SECRET: "${COLLABORATIVE_SERVER_SECRET:-OVERRIDE_ME_PLEASE}"
    RAILS_MIN_THREADS: ${RAILS_MIN_THREADS:-4}
    RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-16}
    # set to true to enable the email receiving feature. See ./docker/cron for more options
    IMAP_ENABLED: "${IMAP_ENABLED:-false}"
    SECRET_KEY_BASE: "${SECRET_KEY_BASE:-OVERWRITE_ME}"
  volumes:
    - "${OPDATA:-opdata}:/var/openproject/assets"

services:
  openproject-cache:
    image: memcached
    <<: *restart_policy

  openproject-web:
    <<: *app
    command: "./docker/prod/web"
    hostname: "${OPENPROJECT_HOST__NAME:-localhost:8080}"
    depends_on:
      openproject-cache:
        condition: service_started
      # 等迁移完成再启动，否则它们启动时会和 seeder 抢着建表，导致首次初始化失败
      openproject-seeder:
        condition: service_completed_successfully
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}/health_checks/default"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  autoheal:
    image: willfarrell/autoheal:1.2.0
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_START_PERIOD: 600
      AUTOHEAL_INTERVAL: 30

  openproject-worker:
    <<: *app
    command: "./docker/prod/worker"
    depends_on:
      openproject-cache:
        condition: service_started
      # 等迁移完成再启动，否则它们启动时会和 seeder 抢着建表，导致首次初始化失败
      openproject-seeder:
        condition: service_completed_successfully

  openproject-cron:
    <<: *app
    command: "./docker/prod/cron"
    depends_on:
      openproject-cache:
        condition: service_started
      # 等迁移完成再启动，否则它们启动时会和 seeder 抢着建表，导致首次初始化失败
      openproject-seeder:
        condition: service_completed_successfully

  openproject-seeder:
    <<: *app
    command: "./docker/prod/seeder"
    restart: on-failure

  hocuspocus:
    image: openproject/hocuspocus:${HOCUSPOCUS_TAG:-18.0-rc}
    environment:
      SECRET: ${COLLABORATIVE_SERVER_SECRET:-OVERRIDE_ME_PLEASE}
      OPENPROJECT_URL: "${OPENPROJECT_URL:-http://openproject-web:8080}"
      OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-true}"
    <<: *restart_policy
